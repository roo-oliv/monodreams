# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# The engine ships shadcn-style (users vendor module source via the `monodreams` CLI),
# so there is no NuGet package to build, validate, or publish — CI is the test gate only.
name: ci
on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  push:
    branches:
      - 'main'       # Run the workflow when pushing to the main branch
  pull_request:
    branches:
      - '*'          # Run the workflow for all pull requests

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  run_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
      # xvfb gives the integration tests a virtual X display: they spawn real game
      # processes, and MonoGame DesktopGL initializes SDL video (a real window + GL
      # context) even in the repo's headless modes — without a display the spawned
      # games abort (SIGABRT). Mesa's software GL on the runner backs the context.
      - name: Run tests
        run: xvfb-run -a dotnet test --configuration Release
